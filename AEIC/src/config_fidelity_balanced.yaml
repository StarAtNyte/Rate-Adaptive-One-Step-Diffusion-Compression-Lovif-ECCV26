training:
  exp_name: "AEIC_fidelity_balanced_"
  max_train_steps: 2500
  train_patch_size: 512
  train_batch_size_total: 8
  train_batch_size_per_gpu: 1
  gradient_accumulation_steps: 2
  save_num: 10
  eval_freq: 250
  max_grad_norm: 0.1
  dataloader_num_workers: 8
  checkpointing_steps: 500

  base:
    lr: 2e-5
    # r3l8's rate weight already produces ~0.026 bpp.  Emphasize MSE while
    # retaining weak perceptual terms to target the complete board score.
    lambda_rate: 8.0
    lambda_l2: 15.0
    lambda_dists: 0.5
    lambda_clip: 0.0
    lambda_adv: 0.0
    lambda_lpips: 0.5

  stages:
    - name: "stage_1"
      end_step: 1250
    - name: "stage_2"
      end_step: 2000
      lr: 1e-5
    - name: "stage_3"
      end_step: 1000000000000
      lr: 3e-6
